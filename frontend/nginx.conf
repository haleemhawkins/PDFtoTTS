server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # REST API
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        client_max_body_size 256m;
    }

    # SignalR hub (WebSocket upgrade)
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Serve ES-module assets (e.g. pdf.js's pdf.worker.min.mjs) with a JS MIME
    # type. nginx's default mime.types has no mapping for .mjs, so it would send
    # application/octet-stream and the browser refuses the module under strict
    # MIME checking ("Failed to load module script"), breaking PDF rendering.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    # pdf.js streams-compiles its JBIG2/OpenJPEG decoders; WebAssembly streaming
    # requires an application/wasm MIME type or the compile is rejected.
    location ~* \.wasm$ {
        default_type application/wasm;
    }

    # Fingerprinted build assets are immutable — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must NOT be cached, or a home-screen PWA keeps booting an old
    # bundle (stale /assets/*.js hashes) after a deploy and never sees the fix.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
